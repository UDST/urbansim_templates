name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lower support boundary: oldest Python plus the minimum
          # supported versions of the direct dependencies
          - name: Python 3.10 + minimum deps
            os: ubuntu-latest
            python-version: "3.10"
            pip-args: -c requirements-min.txt
          # Forward boundary: newest supported Python plus current versions
          # of all dependencies, on each operating system. The published
          # UrbanSim 3.2 release does not run under NumPy 2, so these cells
          # install UrbanSim from its main branch, which supports NumPy 2 and
          # Pandas 3. Remove the branch install once the next UrbanSim
          # release is published.
          - name: Python 3.14 + latest deps
            os: ubuntu-latest
            python-version: "3.14"
            pip-args: '"urbansim @ git+https://github.com/UDST/urbansim@main"'
          - name: Python 3.14 + latest deps (macOS)
            os: macos-latest
            python-version: "3.14"
            pip-args: '"urbansim @ git+https://github.com/UDST/urbansim@main"'
          - name: Python 3.14 + latest deps (Windows)
            os: windows-latest
            python-version: "3.14"
            pip-args: '"urbansim @ git+https://github.com/UDST/urbansim@main"'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-min.txt

      - name: Install package and test dependencies
        run: python -m pip install ".[test]" ${{ matrix.pip-args }}

      - name: Show dependency versions
        run: python -c "import numpy, pandas, orca, urbansim, choicemodels; print('numpy', numpy.__version__); print('pandas', pandas.__version__); print('orca', orca.__version__); print('urbansim', urbansim.__version__); print('choicemodels', choicemodels.__version__)"

      # The tests use paths relative to the tests directory. The package is
      # named explicitly so that coverage measures the installed package
      # rather than the test modules.
      - name: Run tests
        run: python -m pytest --cov=urbansim_templates --cov-report=term-missing
        working-directory: tests

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check source
        run: ruff check urbansim_templates tests

  build:
    name: Package build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install and import wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          cd /tmp
          python -c "import urbansim_templates; print(urbansim_templates.__version__)"

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # autodoc imports the package, which needs the UrbanSim branch install as above
      - name: Install package and documentation tools
        run: python -m pip install ".[docs]" "urbansim @ git+https://github.com/UDST/urbansim@main"

      - name: Build documentation (warnings are errors)
        run: python -m sphinx -E -W --keep-going -b html docs/source docs/build/html
